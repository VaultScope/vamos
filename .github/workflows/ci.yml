name: Rust CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaultscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vaultscope_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vaultscope_test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Initialize database roles
      run: |
        which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
        PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres <<'SQL'
        DO $$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vaultscope') THEN
            CREATE ROLE vaultscope WITH LOGIN PASSWORD 'vaultscope';
          END IF;
        END
        $$;
        SQL
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
